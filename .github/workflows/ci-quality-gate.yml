name: CI Quality & Security Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-and-test:
    name: Typecheck, Unit & Concurrency Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Static TypeScript Check
        run: npm run typecheck

      - name: Run Unit, Chaos & Concurrency Tests
        run: npm test

      - name: Architecture Guardrail Verification (Act IV Gate)
        run: npm run verify:guardrails
